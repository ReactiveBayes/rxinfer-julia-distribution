# The distribution's build project.
#
# This is deliberately NOT a package: it has no `name`/`uuid` and nothing here is
# `Pkg.add`-able. Its only job is to name, exactly, what the shipped distribution
# contains. See AGENTS.md.
#
# RxInfer is a *dependency* here rather than the project itself, on purpose: the
# distribution build copies sources for packages in the manifest, and a root
# package would be baked into the sysimage without its src/ and ext/ being
# shipped, breaking pathof, pkgdir and every package extension.
#
# Every direct dependency carries an equality compat bound -- a distribution
# decides exactly what ships. Bumping one is a reviewable pull request, never a
# side effect of a weekly build.

[deps]
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
RxInfer = "86711068-29c9-4ff7-b620-ae75d7495b3d"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
StatsPlots = "f3b207a7-027a-5e70-b257-86293d7955fd"

[compat]
Plots = "=1.41.7"
RxInfer = "=5.5.2"
StableRNGs = "=1.0.4"
StatsPlots = "=0.15.8"
julia = "=1.12.6"
