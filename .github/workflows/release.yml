---
name: "Distribution"

# Builds the RxInfer Julia distribution for every supported platform, smoke-tests
# the built tree, and publishes the tarballs as a GitHub release.
#
# Builds only when a `v*` tag is registered. There is no schedule: a full matrix
# costs roughly $7 in billed runner minutes (macOS is a 10x multiplier and takes
# ~100 minutes, Windows 2x and ~60), so a weekly refresh would be ~$360/year to
# learn that a dependency moved. Tag when you want a release.
#
# `workflow_dispatch` builds the same matrix without publishing anything, for
# verifying a change to the build before spending a tag on it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  # Two runs must not race for the same release.
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  JULIA_VERSION: "1.12.6"
  # Serialize system image writing on every platform. The image link is the peak
  # memory moment of the build, and it is where the Linux runner was killed with
  # a shutdown signal mid-link; one thread trades a little wall clock for a much
  # lower peak.
  JULIA_IMAGE_THREADS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Works out the version the artifacts are named for, and whether this run
  # publishes. Kept as its own job so both live in one place rather than being
  # recomputed per platform.
  # ---------------------------------------------------------------------------
  plan:
    name: "Plan the release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    outputs:
      tag: "${{ steps.plan.outputs.tag }}"
      version: "${{ steps.plan.outputs.version }}"
      publish: "${{ steps.plan.outputs.publish }}"

    steps:
      - name: "Decide the version and whether to publish"
        id: "plan"
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PUBLISH="true"
          else
            # A manual build: named for the commit, and published nowhere.
            TAG=""
            VERSION="dev-${GITHUB_SHA::7}"
            PUBLISH="false"
          fi

          echo "tag=${TAG}" >>"${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >>"${GITHUB_OUTPUT}"

          echo "Building version ${VERSION}; publish=${PUBLISH}"

  # ---------------------------------------------------------------------------
  # One build per platform. Nothing is cached: every run resolves and links from
  # scratch, which is what makes the artefact trustworthy.
  # ---------------------------------------------------------------------------
  build:
    name: "Build (${{ matrix.platform }})"
    needs: "plan"

    runs-on: "${{ matrix.runner }}"

    # A distribution build is long enough that a wedged one is worth failing
    # rather than leaving to GitHub's six-hour default.
    timeout-minutes: 120

    strategy:
      # One platform failing must not cancel the others: the failure is usually
      # platform-specific, and finishing the rest means a retry only has to
      # rebuild the one that died rather than paying for the matrix again.
      fail-fast: false
      matrix:
        include:
          - platform: "linux-x86_64"
            runner: "ubuntu-latest"
          - platform: "macos-aarch64"
            runner: "macos-latest"
          - platform: "windows-x86_64"
            runner: "windows-latest"

    env:
      DISTRIBUTION_ID: "rxinfer-${{ needs.plan.outputs.version }}-${{ matrix.platform }}"
      # GR opens a display without this and the plotting part of the workload fails.
      GKSwstype: "100"
      # The build must not emit telemetry of its own. CI=true already suppresses
      # it on a hosted runner; this makes it true of a local build too.
      LOG_USING_RXINFER: "false"

    steps:
      - name: "Check out the source"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      # The build action deliberately does not install Julia, so this step is
      # what chooses the runtime the distribution ships. Keep it in step with the
      # `julia` compat entry in Project.toml.
      - name: "Install Julia"
        uses: "julia-actions/install-juliaup@1cc1b0ecfb06c04ff09fe24cab1476106460750e" # v3.1.5
        with:
          channel: "${{ env.JULIA_VERSION }}"

      - name: "Build the distribution"
        id: "build-distribution"
        uses: "JuliaComputing/create-julia-distribution@958799562b82fcabd2f5508f7ee296e1d91de200"
        with:
          distribution-id: "${{ env.DISTRIBUTION_ID }}"
          sysimage-script: "sysimage/banner.jl"

      # `--version` is answered before the system image loads, so it exits 0 even
      # on a tree whose sysimage is missing entirely. Executing real code is the
      # only thing that demonstrates the distribution works -- and a file a
      # dependency reads at run time but the copy globs did not ship shows up
      # here or on a student's laptop, nowhere in between.
      - name: "Smoke-test the built distribution"
        env:
          DISTRIBUTION_PATH: "${{ steps.build-distribution.outputs.distribution-path }}"
        shell: "bash"
        run: |
          set -euo pipefail
          "${DISTRIBUTION_PATH}/bin/julia" --startup-file=no --version
          "${DISTRIBUTION_PATH}/bin/julia" --startup-file=no "${GITHUB_WORKSPACE}/scripts/smoke_test.jl"

      # Ad-hoc signing: no `rcodesign-config-file`, so no Apple Developer
      # account, no secret and nothing to renew. On Apple Silicon the kernel
      # refuses to run a Mach-O whose signature is missing or invalid, and this
      # build creates `sys.dylib` from scratch. This must be the LAST thing that
      # touches the tree, so it comes after the smoke test.
      - name: "Sign the distribution (ad-hoc)"
        if: "matrix.platform == 'macos-aarch64'"
        uses: "JuliaComputing/create-julia-distribution/sign-macos@958799562b82fcabd2f5508f7ee296e1d91de200"
        with:
          distribution-path: "${{ steps.build-distribution.outputs.distribution-path }}"

      # A broken re-sign only shows up when the binary is executed, so execute it.
      - name: "Re-run the smoke test after signing"
        if: "matrix.platform == 'macos-aarch64'"
        env:
          DISTRIBUTION_PATH: "${{ steps.build-distribution.outputs.distribution-path }}"
        shell: "bash"
        run: |
          set -euo pipefail
          codesign --verify --verbose "${DISTRIBUTION_PATH}/bin/julia"
          "${DISTRIBUTION_PATH}/bin/julia" --startup-file=no "${GITHUB_WORKSPACE}/scripts/smoke_test.jl"

      - name: "Pack the distribution"
        id: "pack-distribution"
        uses: "JuliaComputing/create-julia-distribution/pack@958799562b82fcabd2f5508f7ee296e1d91de200"
        with:
          distribution-path: "${{ steps.build-distribution.outputs.distribution-path }}"

      # The installer verifies this before extracting anything, so it is part of
      # the release rather than a nicety.
      - name: "Checksum the tarball"
        id: "checksum"
        env:
          TARBALL_PATH: "${{ steps.pack-distribution.outputs.distribution-tarball-path }}"
          TARBALL_FILENAME: "${{ steps.pack-distribution.outputs.distribution-tarball-filename }}"
        shell: "bash"
        run: |
          set -euo pipefail
          cd "$(dirname "${TARBALL_PATH}")"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${TARBALL_FILENAME}" >"${TARBALL_FILENAME}.sha256"
          else
            shasum -a 256 "${TARBALL_FILENAME}" >"${TARBALL_FILENAME}.sha256"
          fi
          cat "${TARBALL_FILENAME}.sha256"
          echo "sha256-path=${TARBALL_PATH}.sha256" >>"${GITHUB_OUTPUT}"

      # The manifest that was actually built, so a release is reproducible.
      - name: "Record the built manifest"
        if: "matrix.platform == 'linux-x86_64'"
        shell: "bash"
        run: |
          set -euo pipefail
          cp Manifest.toml "manifest-${{ needs.plan.outputs.version }}.toml"

      - name: "Upload the build outputs"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "distribution-${{ matrix.platform }}"
          path: |
            ${{ steps.pack-distribution.outputs.distribution-tarball-path }}
            ${{ steps.checksum.outputs.sha256-path }}
            manifest-${{ needs.plan.outputs.version }}.toml
          if-no-files-found: "error"

  # ---------------------------------------------------------------------------
  # Publish. Separate from the build so the release is created once rather than
  # raced for by three jobs, and only ever for a tag.
  # ---------------------------------------------------------------------------
  publish:
    name: "Publish the release"
    needs: ["plan", "build"]
    # All-or-nothing: a `v1.2.3` missing a platform is worse than no release,
    # because students on that platform get a broken install command rather than
    # a clear "not released yet".
    if: "needs.plan.outputs.publish == 'true' && needs.build.result == 'success'"

    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    permissions:
      contents: "write"

    steps:
      - name: "Download the build outputs"
        uses: "actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b" # v6.0.0
        with:
          path: "artifacts"
          merge-multiple: true

      - name: "Publish"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          set -euo pipefail

          # Collect what actually exists rather than passing globs: an unmatched
          # glob would reach `gh` as a literal path and fail the release.
          ASSETS=()
          while IFS= read -r -d '' asset; do
            ASSETS+=("${asset}")
          done < <(find artifacts -type f \
                     \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.toml' \) \
                     -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No build outputs to publish."
            exit 1
          fi

          printf 'Publishing %s asset(s):\n' "${#ASSETS[@]}"
          printf '  %s\n' "${ASSETS[@]}"

          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --latest --title "${TAG}" --generate-notes "${ASSETS[@]}"
